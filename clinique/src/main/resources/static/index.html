<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinique Médicale — Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:420px;overflow:hidden}
.header{background:linear-gradient(135deg,#1a3a5c,#2e75b6);padding:32px;text-align:center;color:#fff}
.header h1{font-size:22px;margin-bottom:4px}
.header p{font-size:13px;opacity:.8}
.tabs{display:flex;background:#f8f9fa;border-bottom:1px solid #e9ecef}
.tab{flex:1;padding:14px;text-align:center;cursor:pointer;font-size:14px;color:#666;border:none;background:transparent;transition:.2s}
.tab.active{color:#2e75b6;border-bottom:2px solid #2e75b6;font-weight:600;background:#fff}
.form-body{padding:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:10px 14px;border:1.5px solid #dee2e6;border-radius:8px;font-size:14px;transition:.2s;outline:none}
input:focus,select:focus{border-color:#2e75b6;box-shadow:0 0 0 3px rgba(46,117,182,.12)}
.btn{width:100%;padding:12px;background:#2e75b6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px}
.btn:hover{background:#1a5a99}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.msg.success{background:#d4edda;color:#155724;display:block}
.msg.error{background:#f8d7da;color:#721c24;display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-info{background:#e8f4fd;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#2e75b6}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏥 Clinique Médicale</h1>
    <p>Système de gestion — 10 Design Patterns</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Connexion</button>
    <button class="tab" onclick="showTab('register')">Inscription</button>
  </div>

  <!-- LOGIN -->
  <div id="login" class="form-body">
   <!--   <div class="role-info">💡 Comptes de démo : <strong>admin@clinique.ma / admin123</strong><br>
    👨‍⚕️ Médecin: <strong>y.alami@clinique.ma / doctor123</strong><br>
    👤 Patient: <strong>m.idrissi@gmail.com / patient123</strong></div> -->
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="votre@email.com" value="m.idrissi@gmail.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="login-mdp" placeholder="••••••••" value="patient123">
    </div>
    <button class="btn" onclick="login()">Se connecter</button>
    <div id="login-msg" class="msg"></div>
  </div>

  <!-- REGISTER -->
  <div id="register" class="form-body" style="display:none">
    <div class="row2">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="reg-nom" placeholder="Ben Ali">
      </div>
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="reg-prenom" placeholder="Mohamed">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="email@exemple.com">
    </div>
    <div class="form-group">
      <label>Téléphone</label>
      <input type="text" id="reg-tel" placeholder="+216 XX XXX XXX">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="reg-mdp" placeholder="Minimum 6 caractères">
    </div>
    <div class="form-group">
      <label>Rôle</label>
      <select id="reg-role">
        <option value="PATIENT">Patient</option>
        <option value="DOCTOR">Médecin</option>
      </select>
    </div>
    <button class="btn" onclick="inscrire()">S'inscrire</button>
    <div id="reg-msg" class="msg"></div>
  </div>
</div>

<script>
const API = 'http://localhost:8082/api';

function showTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === (tab === 'login' ? 0 : 1)));
    document.getElementById('login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register').style.display = tab === 'register' ? 'block' : 'none';
}

function showMsg(id, msg, ok) {
    const el = document.getElementById(id);
    el.className = 'msg ' + (ok ? 'success' : 'error');
    el.textContent = msg;
}

async function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-mdp').value;
    
    try {
        const response = await fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // ✅ Correction ici - le backend retourne directement le token
            localStorage.setItem('token', data.token);
            localStorage.setItem('userEmail', data.email);
            
            // Récupérer le rôle depuis l'email (ou depuis la réponse)
            let role = data.role;
            
            // Si le rôle n'est pas dans la réponse, on le récupère
            if (!role) {
                const userResponse = await fetch(API + '/users/by-email?email=' + email, {
                    headers: { 'Authorization': `Bearer ${data.token}` }
                });
                if (userResponse.ok) {
                    const user = await userResponse.json();
                    role = user.role;
                }
            }
            
            showMsg('login-msg', 'Connexion réussie ! Redirection...', true);
            
            // Redirection selon le rôle
            setTimeout(() => {
                if (role === 'ADMIN') window.location.href = '/admin.html';
                else if (role === 'DOCTOR') window.location.href = '/medecin.html';
                else window.location.href = '/patient.html';
            }, 1000);
            
        } else {
            showMsg('login-msg', data.error || data.message || 'Email ou mot de passe incorrect', false);
        }
    } catch (error) {
        console.error('Login error:', error);
        showMsg('login-msg', 'Erreur de connexion au serveur', false);
    }
}

async function fetchUserInfo(email, token) {
    try {
        const r = await fetch(API + '/users/by-email?email=' + email, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (r.ok) return await r.json();
    } catch (e) { }
    return { role: 'PATIENT' };
}

async function inscrire() {
    const body = {
        nom: document.getElementById('reg-nom').value,
        prenom: document.getElementById('reg-prenom').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-mdp').value,
        telephone: document.getElementById('reg-tel').value,
        role: document.getElementById('reg-role').value
    };
    
    try {
        const r = await fetch(API + '/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        const data = await r.json();
        
        if (r.ok) {
            showMsg('reg-msg', 'Compte créé avec succès ! Connectez-vous.', true);
            setTimeout(() => showTab('login'), 1500);
        } else {
            showMsg('reg-msg', data.error || data.message || 'Erreur lors de l\'inscription', false);
        }
    } catch (e) {
        showMsg('reg-msg', 'Serveur indisponible.', false);
    }
}
</script>
</body>
</html>
